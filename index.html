<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>La Bitácora · Los registros diarios de la vida de tu bebé</title>
<meta name="description" content="Registra fácilmente las tomas, el sueño, los pañales, los medicamentos y los momentos importantes de cada día. Los datos quedan en tu dispositivo." />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#fcf9f3" />

<!-- PWA. Todas las rutas son relativas para poder publicar en una subcarpeta
     (GitHub Pages) o en la raíz de un dominio propio sin tocar nada. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="icon" href="./icon-512.png" sizes="512x512" type="image/png" />

<!-- iOS / iPadOS: Safari no lee el manifest para la pantalla de inicio. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="La Bitácora" />
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png" />

<link rel="stylesheet" href="./app.css" />
<!-- Capa comercial: hoja de estilos aislada (prefijo .shop-). -->
<link rel="stylesheet" href="./shop.css" />
</head>
<body>

<div data-noprint="1" class="wrap">

  <header class="hd">
    <div>
      <div class="brand-row">
        <span class="brand-dot"></span>
        <span id="brandTxt" class="brand-txt"></span>
        <button id="langBtn" type="button" class="lang-btn" aria-haspopup="dialog"></button>
      </div>
      <input id="child" class="child-input" data-i18n-attr="aria-label:header.childLabel, placeholder:header.childPlaceholder" autocomplete="off" />
      <div id="dateLabel" class="date-label"></div>
      <div id="childHint" class="child-hint" data-i18n="header.childHint" hidden></div>
    </div>

    <div class="daynav">
      <button id="prevDay" class="navbtn" data-i18n-attr="aria-label:header.prevDay" type="button">&lsaquo;</button>
      <input id="datePick" type="date" class="datepick" data-i18n-attr="aria-label:header.pickDate" />
      <button id="nextDay" class="navbtn" data-i18n-attr="aria-label:header.nextDay" type="button">&rsaquo;</button>
      <button id="todayBtn" class="todaybtn" type="button" data-i18n="header.today"></button>
    </div>
  </header>

  <div id="ongoingSlot"></div>

  <div class="cols">

    <div class="col-main">

      <section class="card">
        <div class="eyebrow eyebrow--reg" data-i18n="record.title"></div>
        <div class="share-desc" data-i18n="record.desc"></div>
        <div id="regGrid" class="reg-grid"></div>
      </section>

      <section class="card card--timeline">
        <div class="tl-head">
          <div class="eyebrow" data-i18n="timeline.title"></div>
          <div id="tlCount" class="tl-count"></div>
        </div>
        <div id="timeline"></div>
        <div class="tl-tail"></div>
      </section>
    </div>

    <div class="col-side">
      <section class="card">
        <div class="eyebrow eyebrow--sum" data-i18n="summary.title"></div>
        <div id="summary"></div>
      </section>

      <!-- Punto de anclaje de la capa comercial. Queda vacío si no se carga
           shop.js: la bitácora funciona igual sin él. -->
      <div id="shopMount"></div>

      <section class="share-card">
        <div class="eyebrow" style="margin-bottom:12px" data-i18n="share.title"></div>
        <div class="share-desc" data-i18n="share.desc"></div>
        <div class="share-stack">
          <button id="openShare" class="btn-primary" type="button" data-i18n="share.open"></button>
          <button id="openPdf" class="btn-secondary" type="button" data-i18n="share.pdf"></button>
        </div>
      </section>

      <section class="share-card">
        <div class="eyebrow" style="margin-bottom:12px" data-i18n="backup.title"></div>
        <div class="share-desc" data-i18n="backup.desc"></div>
        <div class="share-stack">
          <button id="exportBackup" class="btn-secondary" type="button" data-i18n="backup.export"></button>
          <button id="importBackup" class="btn-secondary" type="button" data-i18n="backup.import"></button>
        </div>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
      </section>

      <div class="privacy">
        <p data-i18n="privacy.1"></p>
        <p data-i18n="privacy.2"></p>
      </div>
    </div>
  </div>
</div>

<div id="modalSlot"></div>
<div id="toastSlot" aria-live="polite"></div>
<div id="printSlot" data-printsheet="1"></div>

<script defer src="./i18n.js"></script>
<script defer src="./jspdf.umd.min.js"></script>
<script defer src="./app.js"></script>

<!-- Capa comercial. Quitar estas dos líneas la desactiva por completo,
     sin afectar a ninguna función de la bitácora. -->
<script defer src="./catalog.js"></script>
<script defer src="./shop.js"></script>
</body>
</html>
